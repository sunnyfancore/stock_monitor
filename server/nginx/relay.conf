# 模式二（docker-compose.nginx.yml）用的 nginx 配置：
# - TLS 证书用中转服务生成的自签证书（与连接串里的指纹一致）
# - 只有带令牌的 POST /api 会转给中转服务，其余一律是 nginx 原生 404
upstream stock_relay {
    server relay:8080;
    keepalive 8;                         # 与中转服务保持长连接
    keepalive_timeout 10s;               # 必须短于中转服务的 20s 空闲超时，否则会复用到已断开的连接（502）
}

server {
    listen 443 ssl default_server;       # 客户端按 IP 连接、不带 SNI，会落到 default_server
    # 未写 listen [::]:443 —— 关闭了 IPv6 的服务器上它会导致 nginx 起不来；需要时自行加上
    server_name _;

    ssl_certificate     /etc/relay-cert/cert.pem;
    ssl_certificate_key /etc/relay-cert/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:relay_ssl:1m;
    ssl_session_timeout 1h;

    server_tokens off;                   # 响应头只显示 nginx，不带版本号
    access_log off;                      # 不记录访问日志，不留查询痕迹
    client_max_body_size 16k;
    keepalive_timeout 60s;

    location = /api {
        if ($request_method != POST)   { return 404; }
        if ($http_authorization = "")  { return 404; }   # 没带令牌：直接 nginx 404，不打扰后端
        proxy_pass http://stock_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
