# 示例二：nginx 反代 —— nginx 容器负责 TLS，中转服务只在内部网络可见（推荐）
# 没带令牌的请求全部由真正的 nginx 返回 404，对外就是一个普通 https 站点
#
# 部署（目录结构）：
#   /opt/stock-relay/
#     ├─ docker-compose.yml     ← 本文件改名
#     └─ nginx/relay.conf       ← 仓库 server/nginx/relay.conf
#   1. 修改下面 RELAY_PUBLIC_HOST 为服务器公网 IP
#   2. docker compose up -d
#   3. docker exec stock-relay cat /data/url      # 取客户端连接串
#   4. 云服务器安全组放行 TCP 443
services:
  relay:
    image: ghcr.io/sunnyfancore/stock-relay:latest
    container_name: stock-relay
    restart: unless-stopped
    environment:
      RELAY_TLS: "0"                      # 明文，只给 nginx 用；TLS 由 nginx 负责
      RELAY_PORT: "8080"
      RELAY_PUBLIC_HOST: "1.2.3.4"        # ← 改成服务器公网 IP
      RELAY_PUBLIC_PORT: "443"            # ← 与 nginx 的 ports 左边端口一致
    expose:
      - "8080"                            # 不映射到宿主机，外部无法直接访问
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: stock-relay-nginx
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy        # 等中转服务生成好证书再启动
    ports:
      - "443:443"                         # 换端口只改左边，并同步上面的 RELAY_PUBLIC_PORT
    volumes:
      - ./nginx/relay.conf:/etc/nginx/conf.d/default.conf:ro
      - relay-data:/etc/relay-cert:ro     # 与中转服务共用同一张证书 → 客户端指纹一致
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  relay-data:
