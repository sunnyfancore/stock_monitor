# 盯盘小窗 · 加密中转服务：构建 Docker 镜像并推送到 GitHub 容器仓库（GHCR）
#
# 触发：推送 server/ 下的改动、推送 v* 标签，或在 Actions 页面手动运行
# 产物：ghcr.io/<仓库所有者>/stock-relay:latest        最新版
#       ghcr.io/<仓库所有者>/stock-relay:sha-<提交前7位> 每次提交
#       ghcr.io/<仓库所有者>/stock-relay:1.2.3          推送标签 v1.2.3 时
# 部署由你在服务器上用 docker compose 完成，见 server/README.md
name: relay-image

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - ".github/workflows/relay.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: python3 -m py_compile server/relay.py

      - name: 镜像名（GHCR 要求全小写）
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stock-relay" >> "$GITHUB_OUTPUT"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
